name: Build APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk TapMacro.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TapMacro-apk
          path: TapMacro.apk

      # Keeps one always-current download link on the repo's Releases page.
      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest TapMacro.apk \
            --target "$GITHUB_SHA" \
            --title "Tap Macro (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. On your Android phone, download TapMacro.apk below and open it to install. See the README for setup steps." \
            --latest
